name: Release

# Push a version tag (`pnpm release:patch` / `release:minor` bump package.json, tag and push) to check the tree,
# stage the version on npm and create a GitHub release. npm authenticates this workflow by OIDC (trusted
# publishing, configured on npmjs.com for release.yml; only staged publishing is allowed), so there is no token.
# The staged version goes live when a maintainer approves it: `pnpm release:approve` (npm stage approve, with 2FA).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # pnpm packs (publishConfig swaps in dist/); npm publishes the tarball (trusted publishing needs npm >= 11.5.1)
      - run: pnpm build
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - run: npm install -g npm@latest
      - name: stage on npm (approve with `pnpm release:approve`)
        run: npm stage publish "$RUNNER_TEMP"/pricesim-*.tgz --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
